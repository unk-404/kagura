[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
thiserror = { version = "2", default-features = false, features = ["std"] }
