[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.54.1", default-features = false }
zerocopy = { version = "0.8.63", default-features = false }
rapidhash = { version = "4.5.1", default-features = false }
dashmap = { version = "6.2.1", default-features = false }
once_cell = { version = "1.21.4", default-features = false }
bytes = { version = "1.12.1", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
thiserror = { version = "2", default-features = false, features = ["std"] }