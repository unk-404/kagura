[package]
name = "kagura-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kagura"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
kagura-bytecode = { version = "0.1.0", path = "../bytecode" }
kagura-diagnostics = { version = "0.1.0", path = "../diagnostics" }
kagura-interp = { version = "0.1.0", path = "../interp" }
kagura-parser = { version = "0.1.0", path = "../parser" }
kagura-runtime = { version = "0.1.0", path = "../runtime" }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"], optional = true }

[features]
debug = ["kagura-runtime/debug", "dep:tracing-subscriber"]

