name: test262

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Optional case limit (empty runs the full corpus)
        type: string
        required: false
      min_pass:
        description: Minimum number of passing cases
        type: string
        default: "1200"
  push:
    paths:
      - ".github/workflows/test262.yml"
  schedule:
    - cron: "0 3 * * 1"

jobs:
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Download official test262
        run: |
          curl -L --fail --silent --show-error \
            -o /tmp/test262.tar.gz \
            https://codeload.github.com/tc39/test262/tar.gz/refs/heads/main
          mkdir -p /tmp/test262
          tar -xzf /tmp/test262.tar.gz -C /tmp/test262 --strip-components=1
      - name: Run full corpus
        run: |
          set -o pipefail
          ARGS=()
          if [[ -n "${{ inputs.limit }}" ]]; then
            ARGS+=(--limit "${{ inputs.limit }}")
          fi
          MIN_PASS="${{ inputs.min_pass }}"
          MIN_PASS="${MIN_PASS:-1200}"
          cargo run -q -p kagura-cli -- test262 /tmp/test262 --min-pass "$MIN_PASS" "${ARGS[@]}" | tee /tmp/test262-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test262-report
          path: /tmp/test262-report.txt
