name: test262

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Download official test262
        run: |
          curl -L --fail --silent --show-error \
            -o /tmp/test262.tar.gz \
            https://codeload.github.com/tc39/test262/tar.gz/refs/heads/main
          mkdir -p /tmp/test262
          tar -xzf /tmp/test262.tar.gz -C /tmp/test262 --strip-components=1
      - name: Run full corpus
        run: |
          set -o pipefail
          cargo run -q -p kagura-cli -- test262 /tmp/test262 --min-pass 1200 | tee /tmp/test262-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test262-report
          path: /tmp/test262-report.txt
