name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      test262:
        description: Run the full test262 corpus
        type: boolean
        default: true
      limit:
        description: Optional test262 case limit (empty runs the full corpus)
        type: string
        required: false

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows-x86:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc
      - run: cargo test --workspace --target i686-pc-windows-msvc

  linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p kagura-runtime --test bytecode_compat

  linux-x86:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib libc6-dev-i386
      - run: cargo test --workspace --target i686-unknown-linux-gnu

  linux-armv7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabihf
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf qemu-user
      - run: cargo test --workspace --target armv7-unknown-linux-gnueabihf
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_RUNNER: qemu-arm
          QEMU_LD_PREFIX: /usr/arm-linux-gnueabihf

  test262:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.test262 == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Download official test262
        run: |
          curl -L --fail --silent --show-error \
            -o /tmp/test262.tar.gz \
            https://codeload.github.com/tc39/test262/tar.gz/refs/heads/main
          mkdir -p /tmp/test262
          tar -xzf /tmp/test262.tar.gz -C /tmp/test262 --strip-components=1
      - name: Run test262
        run: |
          set -o pipefail
          ARGS=()
          if [[ -n "${{ github.event.inputs.limit }}" ]]; then
            ARGS+=(--limit "${{ github.event.inputs.limit }}")
          fi
          cargo run -q -p kagura-cli -- test262 /tmp/test262 --node --min-pass 1200 "${ARGS[@]}" | tee /tmp/test262-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test262-report
          path: /tmp/test262-report.txt

  wasm-build-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --workspace --target wasm32-unknown-unknown
